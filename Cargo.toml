[package]
name = "gnap-caep-risc"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rcbjBlueMars <9321971+rcbjBlueMars@users.noreply.github.com>"]
description = "Server-side GNAP client with one CAEP and RISC poll receiver"
repository = "https://github.com/rcbj/gnap-caep-risc-rust"
homepage = "https://github.com/rcbj/gnap-caep-risc-rust"
documentation = "https://docs.rs/gnap-caep-risc"
readme = "README.md"
keywords = ["gnap", "caep", "risc", "oauth", "ssf"]
categories = ["authentication"]

[dependencies]
base64 = "0.22"
const-oid = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sec1 = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
url = "2"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
